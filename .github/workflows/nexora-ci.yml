name: NEXORA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m py_compile business_assistant.py database.py
      - name: Validate JSON
        run: python - <<'PY'
import json
from pathlib import Path
for p in Path(".").glob("*.json"):
    json.loads(p.read_text(encoding="utf-8"))
    print("OK", p)
PY
